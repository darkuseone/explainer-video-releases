<script type="module">
// br10 3D layers: transparent 1080x1920 frames, composited later in Python (r.py).
import * as THREE from 'three';
import {Line2} from 'three/addons/lines/Line2.js';
import {LineMaterial} from 'three/addons/lines/LineMaterial.js';
import {LineGeometry} from 'three/addons/lines/LineGeometry.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
const W=1080,H=1920;
const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,alpha:true,preserveDrawingBuffer:true});
R.setPixelRatio(1);R.setSize(W,H,false);R.setClearColor(0,0);
// palette: "web" — link cyan, signal amber, packet green, server magenta
const C={link:0x39D5FF,amber:0xFFB23E,green:0x4DFFA6,mag:0xFF4F8B,white:0xF2F6FF,ink:0x070A14,grey:0x8A93A8};
const CSS={link:'#39D5FF',amber:'#FFB23E',green:'#4DFFA6',mag:'#FF4F8B',white:'#F2F6FF',ink:'#070A14'};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const eout=x=>{x=clamp(x);return 1-Math.pow(1-x,3);};
const eback=(x,s=1.4)=>{x=clamp(x)-1;return x*x*((s+1)*x+s)+1;};
const RES=new THREE.Vector2(W,H);
function lmat(color,width,opacity=1){return new LineMaterial({color,linewidth:width,resolution:RES,transparent:true,opacity,depthWrite:false});}
function poly(color,width,pts,opacity=1){const g=new LineGeometry();g.setPositions(pts.flatMap(p=>[p.x,p.y,p.z]));const l=new Line2(g,lmat(color,width,opacity));l.computeLineDistances();l.frustumCulled=false;return l;}
function setPoly(l,pts){l.geometry.setPositions(pts.flatMap(p=>[p.x,p.y,p.z]));}
function texPlane(w,h,cw,ch){const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;tx.anisotropy=8;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false,side:THREE.DoubleSide}));m.userData={cv,tx,g:cv.getContext('2d')};return m;}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function arcPts(a,b,lift,n=48){const p=[];for(let i=0;i<=n;i++){const u=i/n;const v=a.clone().lerp(b,u);v.y+=Math.sin(u*Math.PI)*lift;v.z+=Math.sin(u*Math.PI)*lift*0.4;p.push(v);}return p;}
function subPts(pts,u0,u1){const n=pts.length-1;const out=[];const a=clamp(u0)*n,b=clamp(u1)*n;if(b-a<1e-3)return [pts[0].clone(),pts[0].clone()];
  const at=x=>{const i=Math.min(n-1,Math.floor(x));return pts[i].clone().lerp(pts[i+1],x-i);};out.push(at(a));for(let i=Math.ceil(a);i<b;i++)out.push(pts[i].clone());out.push(at(b));if(out.length<2)out.push(out[0].clone());return out;}
const SC={};
function init(){

// ================= HOOK: the whole web (globe of links) collapses into one NeXT cube =================
SC.hook=(()=>{
  const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(32,W/H,.05,100);
  const N=900,pts=[];for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*2.39996;pts.push(new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r));}
  const pg=new THREE.BufferGeometry().setFromPoints(pts);
  const dots=new THREE.Points(pg,new THREE.PointsMaterial({color:C.link,size:6,sizeAttenuation:false,transparent:true,depthWrite:false}));
  const globe=new THREE.Group();globe.add(dots);s.add(globe);
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const arcs=[];for(let k=0;k<140;k++){const a=pts[Math.floor(rnd()*N)],b=pts[Math.floor(rnd()*N)];if(a.distanceTo(b)<.4)continue;
    const p=[];for(let i=0;i<=40;i++){const u=i/40;const v=a.clone().lerp(b,u).normalize().multiplyScalar(1+0.35*Math.sin(u*Math.PI)*a.distanceTo(b)/2);p.push(v);}
    const l=poly(rnd()<.7?C.link:C.amber,2.2,p,.85);l.userData={p,ph:rnd()};globe.add(l);arcs.push(l);}
  // NeXT-style black cube
  const cube=new THREE.Group();s.add(cube);
  const body=new THREE.Mesh(new RoundedBoxGeometry(1,1,1,4,.03),new THREE.MeshStandardMaterial({color:0x1b1d24,roughness:.45,metalness:.5,transparent:true}));cube.add(body);
  const eg=new THREE.EdgesGeometry(new THREE.BoxGeometry(1.004,1.004,1.004));const ep=[];const pa=eg.attributes.position.array;
  const edges=[];for(let i=0;i<pa.length;i+=6){const l=poly(C.link,3,[new THREE.Vector3(pa[i],pa[i+1],pa[i+2]),new THREE.Vector3(pa[i+3],pa[i+4],pa[i+5])],.9);cube.add(l);edges.push(l);}
  const note=texPlane(.62,.34,620,340);note.position.set(0,.05,.505);cube.add(note);
  {const g=note.userData.g;g.fillStyle='#F4EFE2';g.fillRect(0,0,620,340);g.fillStyle='#C8102E';g.font='bold 64px Cav';g.textAlign='center';
   g.font='bold 54px Cav';g.fillText('This machine is a server.',310,90);g.font='bold 74px Cav';g.fillText('DO NOT',310,190);g.fillText('POWER IT DOWN!!',310,275);note.userData.tx.needsUpdate=true;}
  s.add(new THREE.AmbientLight(0xffffff,.5));const dl=new THREE.DirectionalLight(0xffffff,2.2);dl.position.set(2,3,4);s.add(dl);const rl=new THREE.PointLight(C.link,6,10);rl.position.set(-2,-1,2);s.add(rl);
  return (t,p)=>{
    // p.col = collapse start, p.note = sticker time
    const warp=eout(t/0.45);
    cam.position.set(0,0,1.15+5.0*(1-warp)*0+2.6*warp);// crash-zoom from inside the web out to the globe
    cam.position.z=0.45+5.6*warp;cam.lookAt(0,0,0);
    const c=ease((t-p.col)/0.55);
    globe.rotation.y=t*0.9+ (1-warp)*2.5;globe.rotation.x=0.35;
    const gs=(1-c)*(1+0.25*(1-warp));globe.scale.setScalar(Math.max(.001,gs));
    dots.material.opacity=1-c*0.9;
    arcs.forEach(l=>{const ph=(t*0.6+l.userData.ph)%1;const u0=Math.max(0,ph-0.35),u1=ph;setPoly(l,subPts(l.userData.p,u0,u1));l.material.opacity=.85*(1-c);});
    const cs=eback((t-p.col-0.25)/0.5,1.6);cube.scale.setScalar(Math.max(.001,1.5*cs));cube.visible=cs>0.01;
    cube.rotation.y=-0.55+Math.sin(t*0.7)*0.18+(1-eout((t-p.col)/1.2))*2.2;cube.rotation.x=0.22;
    edges.forEach(l=>{l.material.opacity=0.8+0.2*Math.max(0,1-(t-p.col-0.4)/1.2);l.material.linewidth=5;});
    note.visible=t>=p.note;const nu=eback((t-p.note)/0.25,2);note.scale.setScalar(Math.max(.001,1.6-0.6*nu));
    R.render(s,cam);};
})();

// ================= PIPE: how a browser loads a page =================
SC.pipe=(()=>{
  const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,W/H,.05,100);cam.position.set(0,0,10.6);cam.lookAt(0,0,0);
  s.add(new THREE.AmbientLight(0xffffff,.6));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(3,4,6);s.add(dl);
  const root=new THREE.Group();s.add(root);
  // browser window (top)
  const win=texPlane(2.55,1.725,1020,690);win.position.set(0,1.55,0);root.add(win);
  // DNS phone book (left middle)
  const book=new THREE.Group();book.position.set(-0.68,-0.45,0);book.scale.setScalar(.8);root.add(book);
  const cover=new THREE.Mesh(new RoundedBoxGeometry(1.3,1.7,.32,3,.04),new THREE.MeshStandardMaterial({color:0x13324a,roughness:.5,metalness:.2}));book.add(cover);
  const btxt=texPlane(1.2,1.6,360,480);btxt.position.z=.165;book.add(btxt);
  {const g=btxt.userData.g;g.clearRect(0,0,360,480);g.strokeStyle=CSS.link;g.lineWidth=6;rr(g,14,14,332,452,18);g.stroke();g.fillStyle=CSS.link;g.font='800 92px Unb';g.textAlign='center';g.fillText('DNS',180,215);
   g.font='600 30px Mono';g.fillStyle='#BFEFFF';g.fillText('имя → адрес',180,290);for(let i=0;i<5;i++){g.fillStyle='rgba(57,213,255,.35)';g.fillRect(60,330+i*24,240-i*30,8);}btxt.userData.tx.needsUpdate=true;}
  const lookup=texPlane(2.4,.5,960,200);lookup.position.set(0,-1.75,.2);root.add(lookup);
  // server rack (right middle)
  const rack=new THREE.Group();rack.position.set(0.72,-0.45,0);root.add(rack);
  const leds=[];for(let i=0;i<5;i++){const b=new THREE.Mesh(new RoundedBoxGeometry(1.25,.28,.8,2,.03),new THREE.MeshStandardMaterial({color:0x1a1d26,roughness:.4,metalness:.6}));b.position.y=.66-i*.33;rack.add(b);
    for(let k=0;k<4;k++){const l=new THREE.Mesh(new THREE.SphereGeometry(.028,10,8),new THREE.MeshBasicMaterial({color:C.green}));l.position.set(-.45+k*.1,.66-i*.33,.41);rack.add(l);leds.push(l);}
    const sl=new THREE.Mesh(new THREE.PlaneGeometry(.55,.05),new THREE.MeshBasicMaterial({color:0x2c3140}));sl.position.set(.25,.66-i*.33,.405);rack.add(sl);}
  const rlab=texPlane(1.3,.3,520,120);rlab.position.set(0,-1.0,0.3);rack.add(rlab);
  {const g=rlab.userData.g;g.fillStyle=CSS.mag;g.font='800 64px Unb';g.textAlign='center';g.fillText('СЕРВЕР',260,85);rlab.userData.tx.needsUpdate=true;}
  // links
  const A=new THREE.Vector3(-.4,.55,.1),B=new THREE.Vector3(-1.0,.55,.1),Srv=new THREE.Vector3(1.15,.55,.1);
  const p1=arcPts(new THREE.Vector3(-.6,.6,.1),new THREE.Vector3(-1.0,0.55,.2),.0,30); // browser -> dns (short drop)
  const pathDns=[new THREE.Vector3(-.5,.62,.2),new THREE.Vector3(-0.9,.5,.2)];
  const pDown=arcPts(new THREE.Vector3(-.3,.68,.3),new THREE.Vector3(-0.68,.35,.3),.25,30);
  const pSrv=arcPts(new THREE.Vector3(-0.68,.35,.3),new THREE.Vector3(0.72,.35,.3),.45,48);
  const pBack=arcPts(new THREE.Vector3(0.72,.35,.3),new THREE.Vector3(0.1,.8,.3),.5,48);
  const l1=poly(C.link,5,pDown),l2=poly(C.amber,5,pSrv),l3=poly(C.green,5,pBack);[l1,l2,l3].forEach(l=>root.add(l));
  const pk=new THREE.Mesh(new THREE.SphereGeometry(.07,16,12),new THREE.MeshBasicMaterial({color:C.white}));root.add(pk);
  const halo=new THREE.Mesh(new THREE.SphereGeometry(.16,16,12),new THREE.MeshBasicMaterial({color:C.amber,transparent:true,opacity:.35}));pk.add(halo);
  // html tokens flying back
  const TOK=['<html>','<h1>','<img>','<p>','<a href>','</p>','<div>','<style>'];
  const toks=TOK.map((w,i)=>{const m=texPlane(.9,.24,360,96);const g=m.userData.g;g.fillStyle='rgba(7,10,20,.85)';rr(g,4,4,352,88,40);g.fill();g.strokeStyle=CSS.green;g.lineWidth=5;rr(g,4,4,352,88,40);g.stroke();
    g.fillStyle=CSS.green;g.font='700 46px Mono';g.textAlign='center';g.fillText(w,180,64);m.userData.tx.needsUpdate=true;root.add(m);return m;});
  function drawWin(g,t,p){
    g.clearRect(0,0,1020,690);
    g.fillStyle='rgba(12,16,28,.95)';rr(g,6,6,1008,678,34);g.fill();g.strokeStyle='rgba(57,213,255,.9)';g.lineWidth=5;rr(g,6,6,1008,678,34);g.stroke();
    ['#FF5F57','#FEBC2E','#28C840'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.arc(52+i*40,52,13,0,7);g.fill();});
    g.fillStyle='rgba(255,255,255,.08)';rr(g,190,26,790,54,27);g.fill();
    const url='https://example.com';const n=Math.floor(clamp((t-p.type)/0.7)*url.length);
    g.fillStyle='#E8F3FF';g.font='600 34px Mono';g.textAlign='left';g.fillText(url.slice(0,n)+((t*2%1<.5&&t<p.dns)?'|':''),220,64);
    // progress bar
    const prog=clamp((t-p.dns)/(p.paint+0.6-p.dns));if(t>p.dns&&t<p.paint+0.8){g.fillStyle=CSS.link;g.fillRect(20,96,980*prog,6);}
    // page paint: blocks drop in
    const q=t-p.paint;if(q>0){
      const blk=[[40,130,940,90,CSS.amber],[40,250,440,250,CSS.link],[510,250,470,30,'#DDE6F5'],[510,300,420,30,'#DDE6F5'],[510,350,450,30,'#DDE6F5'],[510,400,300,30,'#DDE6F5'],[40,530,940,30,'#DDE6F5'],[40,580,700,30,'#DDE6F5'],[40,630,220,40,CSS.mag]];
      blk.forEach((b,i)=>{const u=eback((q-i*0.07)/0.3,1.3);if(u<=0)return;g.globalAlpha=clamp(u);g.fillStyle=b[4];const hh=b[3]*clamp(u,0,1.2);rr(g,b[0],b[1]+(1-clamp(u))*30,b[2],Math.max(2,hh),10);g.fill();});
      g.globalAlpha=1;
      if(q>0.2){g.fillStyle=CSS.ink;g.font='800 52px Unb';g.fillText('Привет, веб!',70,195);}
    }
  }
  return (t,p)=>{
    // p: type, dns, ip, srv, back, paint, end(for zoom)
    const intro=eout((t-p.t0)/0.5);
    root.scale.setScalar(0.85+0.15*intro);root.rotation.y=Math.sin(t*0.45)*0.18;root.rotation.x=-0.06+Math.sin(t*0.3)*0.04;
    drawWin(win.userData.g,t,p);win.userData.tx.needsUpdate=true;
    // book pulses when asked
    const bk=eout((t-p.dns)/0.4);book.scale.setScalar(.6+.4*eout((t-p.t0)/0.6)+.12*Math.max(0,1-Math.abs(t-p.dns-0.5)/0.5));book.rotation.y=0.35-0.35*bk;
    // lookup line
    {const g=lookup.userData.g;g.clearRect(0,0,960,200);const u=eout((t-p.ip)/0.35);if(u>0){g.globalAlpha=u;g.fillStyle='rgba(7,10,20,.9)';rr(g,6,30,948,140,70);g.fill();g.strokeStyle=CSS.link;g.lineWidth=5;rr(g,6,30,948,140,70);g.stroke();
      g.fillStyle='#E8F3FF';g.font='700 50px Mono';g.textAlign='center';g.fillText('example.com → 203.0.113.7',480,118);g.globalAlpha=1;}lookup.userData.tx.needsUpdate=true;}
    rack.scale.setScalar(.6+.4*eout((t-p.t0-0.15)/0.6));rack.rotation.y=-0.35+0.35*eout((t-p.srv)/0.5);
    leds.forEach((l,i)=>{const on=t>p.srv?(Math.sin(t*23+i*2.7)>-.2):(Math.sin(t*3+i)>.6);l.material.color.setHex(on?C.green:0x123322);});
    // packet route
    let pos=null,col=C.amber;
    const u1=(t-p.dns)/0.5,u2=(t-p.srv)/0.75,u3=(t-p.back)/0.8;
    setPoly(l1,subPts(pDown,0,clamp(u1)));l1.material.opacity=t<p.paint?0.9:0.3;
    setPoly(l2,subPts(pSrv,0,clamp(u2)));l2.material.opacity=t<p.paint?0.9:0.3;
    setPoly(l3,subPts(pBack,0,clamp(u3)));l3.material.opacity=t<p.paint+0.5?0.9:0.3;
    if(u1>=0&&u1<1){pos=subPts(pDown,0,u1).pop();col=C.link;}
    else if(u2>=0&&u2<1){pos=subPts(pSrv,0,u2).pop();col=C.amber;}
    pk.visible=!!pos;if(pos){pk.position.copy(pos);halo.material.color.setHex(col);halo.scale.setScalar(1+.3*Math.sin(t*30));}
    toks.forEach((m,i)=>{const u=(t-p.back-i*0.09)/0.7;m.visible=u>0&&u<1.15;if(!m.visible)return;const q=subPts(pBack,0,clamp(u)).pop();
      m.position.set(q.x+Math.sin(i*1.7)*.35*(1-clamp(u)),q.y+Math.cos(i*2.3)*.25*(1-clamp(u)),q.z+.2);m.scale.setScalar(1-0.5*clamp(u-0.7,0,1)/0.3*1);m.material.opacity=1-clamp((u-0.95)/0.2);});
    // final: window zooms to fill the frame
    const z=ease((t-p.paint-0.2)/0.9);
    win.position.set(0,1.55-1.45*z,1.5*z);win.scale.setScalar(1+0.1*z);
    [book,rack,lookup,l1,l2,l3].forEach(o=>{if(o.material)o.material.opacity=Math.min(o.material.opacity,1-z*0.85);else o.visible=z<0.9;});
    lookup.visible=z<0.6;
    R.render(s,cam);};
})();

// ================= SHARE: browser market donut =================
SC.donut=(()=>{
  const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,W/H,.05,100);cam.position.set(0,-3.2,10.5);cam.lookAt(0,0,0);
  s.add(new THREE.AmbientLight(0xffffff,.55));const dl=new THREE.DirectionalLight(0xffffff,2.4);dl.position.set(2,4,5);s.add(dl);
  const g=new THREE.Group();s.add(g);
  const share=0.6879;
  const mk=(a0,a1,col,h)=>{const sh=new THREE.Shape();const R1=1.45,R0=.78,n=64;sh.moveTo(Math.cos(a0)*R1,Math.sin(a0)*R1);
    for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;sh.lineTo(Math.cos(a)*R1,Math.sin(a)*R1);}for(let i=n;i>=0;i--){const a=a0+(a1-a0)*i/n;sh.lineTo(Math.cos(a)*R0,Math.sin(a)*R0);}
    const geo=new THREE.ExtrudeGeometry(sh,{depth:h,bevelEnabled:true,bevelSize:.02,bevelThickness:.02,bevelSegments:2,curveSegments:48});
    const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,roughness:.35,metalness:.25}));return m;};
  let chrome=null,rest=null;
  return (t,p)=>{
    const u=ease((t-p.t0)/1.0);
    if(chrome){g.remove(chrome);chrome.geometry.dispose();}if(rest){g.remove(rest);rest.geometry.dispose();}
    const a0=Math.PI/2,a1=a0-2*Math.PI*share*Math.max(.002,u);
    chrome=mk(a1,a0,C.link,.38);
    rest=mk(a0-2*Math.PI*share*u-2*Math.PI*(1-share)*u,a1,0x2b3346,.18);
    chrome.position.z=.0;g.add(chrome);g.add(rest);
    g.rotation.x=-0.75;g.rotation.z=Math.sin(t*0.4)*0.08;g.scale.setScalar(.7+.3*eback((t-p.t0)/0.6,1.2));
    chrome.position.set(Math.cos((a0+a1)/2)*.08,Math.sin((a0+a1)/2)*.08,0);
    R.render(s,cam);};
})();

}
window.render=(name,t,p)=>{SC[name](t,p);return R.domElement.toDataURL('image/png');};
document.fonts.load('80px Cav').then(()=>document.fonts.load('80px Unb')).then(()=>document.fonts.load('40px Mono')).then(()=>{init();window.ready=true;});
</script>
