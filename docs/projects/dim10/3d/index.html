<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// dim10 3D layer: transparent 1080x1920 frames, composited later in Python.
import * as THREE from 'three';
import {Line2} from 'three/addons/lines/Line2.js';
import {LineMaterial} from 'three/addons/lines/LineMaterial.js';
import {LineGeometry} from 'three/addons/lines/LineGeometry.js';
const W=1080,H=1920;
const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,alpha:true,preserveDrawingBuffer:true});
R.setPixelRatio(1);R.setSize(W,H,false);R.setClearColor(0,0);
// palette (dimension = colour)
const C={d0:0xF3F5FF,d1:0x3FD2FF,d2:0x8A7BFF,d3:0xFFB23E,d4:0xFF4FA3,t:0x7CF0FF,d5:0xB98CFF,ink:0x0A0D1A};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const eout=x=>{x=clamp(x);return 1-Math.pow(1-x,3);};
const RES=new THREE.Vector2(W,H);
function seg(color,width,opacity=1){const g=new LineGeometry();g.setPositions([0,0,0,0,0,0]);
  const m=new LineMaterial({color,linewidth:width,resolution:RES,transparent:true,opacity,depthWrite:false});
  const l=new Line2(g,m);l.frustumCulled=false;return l;}
function setSeg(l,a,b){l.geometry.setPositions([a.x,a.y,a.z,b.x,b.y,b.z]);l.computeLineDistances();}
function poly(color,width,pts,opacity=1){const g=new LineGeometry();g.setPositions(pts.flatMap(p=>[p.x,p.y,p.z]));
  const m=new LineMaterial({color,linewidth:width,resolution:RES,transparent:true,opacity,depthWrite:false});const l=new Line2(g,m);l.frustumCulled=false;return l;}
function setPoly(l,pts){l.geometry.setPositions(pts.flatMap(p=>[p.x,p.y,p.z]));}
function dot(color,r){const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),new THREE.MeshBasicMaterial({color,transparent:true}));return m;}
const SC={};

// ---------- BUILD: point -> line -> square -> cube -> tesseract ----------
SC.build=(()=>{
  const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,W/H,.1,100);
  const V=[];for(let i=0;i<16;i++)V.push([i&1?1:-1,i&2?1:-1,i&4?1:-1,i&8?1:-1]);
  const E=[];for(let i=0;i<16;i++)for(let k=0;k<4;k++){const j=i^(1<<k);if(j>i)E.push([i,j,k]);}
  const col=[C.d1,C.d2,C.d3,C.d4];
  const L=E.map(([i,j,k])=>{const l=seg(col[k],9);s.add(l);return l;});
  const D=V.map(()=>{const d=dot(C.d0,.07);s.add(d);return d;});
  const g=new THREE.Group();s.add(g);
  return (t,p)=>{
    // p.k=[t1,t2,t3,t4] start times of extrusion along x,y,z,w; p.rot = start of 4D rotation
    const e=[0,1,2,3].map(i=>ease((t-p.k[i])/0.7));
    const a=(t-p.rot)>0?(t-p.rot)*0.75:0, b=(t-p.rot)>0?(t-p.rot)*0.45:0;
    const sc=1.05;
    const P=V.map(v=>{let x=v[0]*e[0]*sc,y=v[1]*e[1]*sc,z=v[2]*e[2]*sc,w=v[3]*e[3]*sc;
      // 4D rotations xw and yz-free zw
      let x2=x*Math.cos(a)-w*Math.sin(a),w2=x*Math.sin(a)+w*Math.cos(a);
      let z2=z*Math.cos(b)-w2*Math.sin(b),w3=z*Math.sin(b)+w2*Math.cos(b);
      const f=5/(5-w3);return new THREE.Vector3(x2*f,y*f,z2*f);});
    E.forEach(([i,j,k],n)=>{setSeg(L[n],P[i],P[j]);L[n].material.opacity=e[k]>0.001?1:0;
      L[n].material.linewidth= k==3?7:9;});
    const po=p.pt===undefined?1:ease((t-p.pt)/0.25);D.forEach((d,n)=>{d.position.copy(P[n]);d.scale.setScalar(0.001+po*(1+1.2*Math.max(0,1-(t-p.pt)*2.5)));});
    // camera: frontal for 0D-2D, swings to 3/4 view for 3D+
    const sw=ease((t-p.k[2]+0.2)/1.2);
    const az=sw*0.62+ (t>p.k[2]?(t-p.k[2])*0.06:0), el=sw*0.42;
    const dist=15.5 + 7*ease((t-p.k[3])/1.5);
    cam.position.set(dist*Math.sin(az)*Math.cos(el),dist*Math.sin(el)+0.0,dist*Math.cos(az)*Math.cos(el));
    cam.lookAt(0,0,0);
    R.render(s,cam);
  };})();

// ---------- RETINA: 3D object projected through a lens onto a flat sheet ----------
SC.retina=(()=>{
  const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(32,W/H,.1,100);
  const V=[];for(let i=0;i<8;i++)V.push(new THREE.Vector3(i&1?.9:-.9,i&2?.9:-.9,i&4?.9:-.9));
  const E=[];for(let i=0;i<8;i++)for(let k=0;k<3;k++){const j=i^(1<<k);if(j>i)E.push([i,j]);}
  const obj=E.map(()=>{const l=seg(C.d3,8);s.add(l);return l;});
  const img=E.map(()=>{const l=seg(C.d1,7);s.add(l);return l;});
  const rays=V.map(()=>{const l=seg(C.d0,2,.35);s.add(l);return l;});
  // retina sheet
  const sheet=new THREE.Mesh(new THREE.PlaneGeometry(4.2,4.2),new THREE.MeshBasicMaterial({color:C.d1,transparent:true,opacity:.10,side:2,depthWrite:false}));
  s.add(sheet);const frame=poly(C.d1,4,[[-2.1,-2.1],[2.1,-2.1],[2.1,2.1],[-2.1,2.1],[-2.1,-2.1]].map(([x,y])=>new THREE.Vector3(x,y,0)),.8);s.add(frame);
  const lens=dot(C.d0,.09);s.add(lens);
  const Y0=2.6, YL=0, YR=-3.2; // object centre y, lens y, retina plane y
  sheet.rotation.x=-Math.PI/2;sheet.position.y=YR;frame.rotation.x=-Math.PI/2;frame.position.y=YR;
  return (t,p)=>{
    const a=t*0.5, q=new THREE.Quaternion().setFromEuler(new THREE.Euler(0.5,a,0.2));
    const W3=V.map(v=>v.clone().applyQuaternion(q).add(new THREE.Vector3(0,Y0,0)));
    const lp=new THREE.Vector3(0,YL,0);
    const I=W3.map(w=>{const d=lp.clone().sub(w);const k=(YR-w.y)/d.y;return w.clone().add(d.multiplyScalar(k));});
    E.forEach(([i,j],n)=>{setSeg(obj[n],W3[i],W3[j]);setSeg(img[n],I[i],I[j]);img[n].material.opacity=ease((t-p.img)/0.6);});
    V.forEach((_,n)=>{setSeg(rays[n],W3[n],I[n]);rays[n].material.opacity=.35*ease((t-p.rays)/0.6);});
    const az=0.35+t*0.04;cam.position.set(23*Math.sin(az),1.0,23*Math.cos(az));cam.lookAt(0,0.1,0);
    R.render(s,cam);
  };})();

// ---------- SPACETIME: stacked space slices + worldline along time ----------
SC.spacetime=(()=>{
  const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(32,W/H,.1,200);
  const N=5,G=11,S=2.6;const slices=[];
  for(let k=0;k<N;k++){const lines=[];for(let i=0;i<G;i++){const a=poly(C.d2,3,Array.from({length:40},()=>new THREE.Vector3()),.55);const b=poly(C.d2,3,Array.from({length:40},()=>new THREE.Vector3()),.55);s.add(a,b);lines.push(a,b);}
    const m=dot(C.d3,.32);s.add(m);slices.push({lines,m});}
  const world=poly(C.t,10,Array.from({length:120},()=>new THREE.Vector3()));s.add(world);
  const arrow=seg(C.t,6);s.add(arrow);
  const mx=(k,t)=>1.0*Math.sin(k*0.9+t*0.6), mz=(k,t)=>0.8*Math.cos(k*0.6+t*0.4);
  const h=(x,z,cx,cz)=>-1.3/(1+((x-cx)**2+(z-cz)**2)*1.4);
  return (t,p)=>{
    const sp=2.2;
    slices.forEach((sl,k)=>{const y=(k-(N-1)/2)*sp, cx=mx(k,0), cz=mz(k,0);
      const vis=ease((t-p.stack-k*0.12)/0.5)*(k==0?1:1);const vk=k==0?1:vis;
      let n=0;for(let i=0;i<G;i++){const u=-S+2*S*i/(G-1);
        const pa=[],pb=[];for(let j=0;j<40;j++){const v=-S+2*S*j/39;pa.push(new THREE.Vector3(u,y+h(u,v,cx,cz)*ease((t-p.warp)/0.8),v));pb.push(new THREE.Vector3(v,y+h(v,u,cx,cz)*ease((t-p.warp)/0.8),u));}
        setPoly(sl.lines[n],pa);setPoly(sl.lines[n+1],pb);sl.lines[n].material.opacity=sl.lines[n+1].material.opacity=.5*vk;n+=2;}
      sl.m.position.set(cx,y+0.3,cz);sl.m.material.opacity=vk;});
    const wp=[];for(let j=0;j<120;j++){const kk=j/119*(N-1);const k0=Math.floor(kk),f=kk-k0,k1=Math.min(N-1,k0+1);
      const cx=mx(k0,0)*(1-f)+mx(k1,0)*f, cz=mz(k0,0)*(1-f)+mz(k1,0)*f;wp.push(new THREE.Vector3(cx,(kk-(N-1)/2)*sp+0.3,cz));}
    const wl=Math.max(2,Math.floor(120*ease((t-p.world)/1.2)));setPoly(world,wp.slice(0,wl).concat(Array(120-wl).fill(wp[wl-1])));
    world.material.opacity=(t>p.world)?1:0;
    setSeg(arrow,new THREE.Vector3(-S-0.6,-(N-1)/2*sp,-S),new THREE.Vector3(-S-0.6,-(N-1)/2*sp+((N-1)*sp+1.2)*ease((t-p.world)/1),-S));
    const az=0.75+t*0.05;cam.position.set(34*Math.sin(az),8,34*Math.cos(az));cam.lookAt(0,1.2,0);
    R.render(s,cam);
  };})();

// ---------- HOSE: far = a line, close = a tube with a curled-up circle ----------
SC.hose=(()=>{
  const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,W/H,.01,500);
  const r=0.5,Lh=60,NR=90,NL=16;
  const rings=[];for(let i=0;i<NR;i++){const x=-Lh/2+Lh*i/(NR-1);const pts=[];for(let j=0;j<=48;j++){const a=j/48*Math.PI*2;pts.push(new THREE.Vector3(x,r*Math.cos(a),r*Math.sin(a)));}
    const l=poly(C.d5,3,pts,.7);s.add(l);rings.push(l);}
  const longs=[];for(let j=0;j<NL;j++){const a=j/NL*Math.PI*2;const l=poly(C.d1,3,[new THREE.Vector3(-Lh/2,r*Math.cos(a),r*Math.sin(a)),new THREE.Vector3(Lh/2,r*Math.cos(a),r*Math.sin(a))],.8);s.add(l);longs.push(l);}
  const core=seg(C.d1,10);setSeg(core,new THREE.Vector3(-Lh/2,0,0),new THREE.Vector3(Lh/2,0,0));s.add(core);
  const ant=dot(C.d3,.045);s.add(ant);const trail=poly(C.d3,8,Array.from({length:60},()=>new THREE.Vector3()));s.add(trail);
  return (t,p)=>{
    const z=ease((t-p.zoom)/2.2);
    const dist=150*(1-z)+3.2*z; // camera distance
    cam.position.set(0.0+1.8*z,0.9*z,dist);cam.lookAt(0,0,0);
    cam.fov=30;cam.updateProjectionMatrix();
    core.material.opacity=1-ease((t-p.zoom-0.6)/1.0);
    rings.forEach(l=>l.material.opacity=.7*ease((t-p.zoom-0.4)/1.2));
    longs.forEach(l=>l.material.opacity=.8*ease((t-p.zoom-0.4)/1.2));
    const at=Math.max(0,t-p.ant)*2.2;const ax=0.0;
    ant.position.set(ax,r*1.02*Math.cos(at),r*1.02*Math.sin(at));ant.material.opacity=ease((t-p.ant)/0.3);
    const tp=[];for(let j=0;j<60;j++){const aa=Math.max(0,at-j*0.05);tp.push(new THREE.Vector3(ax,r*1.02*Math.cos(aa),r*1.02*Math.sin(aa)));}
    setPoly(trail,tp);trail.material.opacity=ease((t-p.ant)/0.3);
    R.render(s,cam);
  };})();

// ---------- CY: Calabi-Yau quintic cross-section (Hanson projection) ----------
SC.cy=(()=>{
  const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,W/H,.1,100);
  s.add(new THREE.AmbientLight(0xffffff,0.55));const dl=new THREE.DirectionalLight(0xffffff,1.6);dl.position.set(3,4,5);s.add(dl);
  const n=5,NU=14,NV=14,al=Math.PI/4;const grp=new THREE.Group();s.add(grp);
  const cpow=(re,im,e)=>{const r=Math.hypot(re,im),th=Math.atan2(im,re);const rr=Math.pow(r,e);return [rr*Math.cos(th*e),rr*Math.sin(th*e)];};
  for(let k1=0;k1<n;k1++)for(let k2=0;k2<n;k2++){
    const pos=[],idx=[],cols=[];
    for(let i=0;i<=NU;i++)for(let j=0;j<=NV;j++){const x=-1+2*i/NU,y=(Math.PI/2)*j/NV;
      const ch=[Math.cosh(x)*Math.cos(y),Math.sinh(x)*Math.sin(y)], sh=[Math.sinh(x)*Math.cos(y),Math.cosh(x)*Math.sin(y)];
      let z1=cpow(ch[0],ch[1],2/n); let msh=[sh[1],-sh[0]]; let z2=cpow(msh[0],msh[1],2/n);
      const p1=2*Math.PI*k1/n,p2=2*Math.PI*k2/n;
      z1=[z1[0]*Math.cos(p1)-z1[1]*Math.sin(p1),z1[0]*Math.sin(p1)+z1[1]*Math.cos(p1)];
      z2=[z2[0]*Math.cos(p2)-z2[1]*Math.sin(p2),z2[0]*Math.sin(p2)+z2[1]*Math.cos(p2)];
      pos.push(z1[0],z2[0],Math.cos(al)*z1[1]+Math.sin(al)*z2[1]);
      const c=new THREE.Color(C.d5).lerp(new THREE.Color(C.d4),(k1+k2)/(2*n-2));cols.push(c.r,c.g,c.b);}
    for(let i=0;i<NU;i++)for(let j=0;j<NV;j++){const a=i*(NV+1)+j,b=a+NV+1;idx.push(a,b,a+1,b,b+1,a+1);}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));g.setIndex(idx);g.computeVertexNormals();
    grp.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,side:2,roughness:.35,metalness:.2,transparent:true,opacity:.92})));
    grp.add(new THREE.LineSegments(new THREE.WireframeGeometry(g),new THREE.LineBasicMaterial({color:C.d0,transparent:true,opacity:.18})));
  }
  return (t,p)=>{const sc=ease((t-p.in)/0.9);grp.scale.setScalar(0.001+sc*1.0);grp.rotation.set(0.5+t*0.17,t*0.31,0.2);
    cam.position.set(0,0,12.5);cam.lookAt(0,0,0);R.render(s,cam);};})();

window.render=(name,t,p)=>{SC[name](t,p);return document.getElementById('c').toDataURL('image/png');};
window.ready=true;
</script>
