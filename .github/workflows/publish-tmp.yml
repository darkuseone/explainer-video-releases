name: publish-tmp
# Временный: для каждой папки media/<tag>/ с release.txt создаёт/обновляет релиз <tag> (файлы заменяются). Удалить после публикации.
on:
  push:
    branches: [claude/nice-edison-e48b88]
    paths: ['media/**/release.txt']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'drop temp') }}
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for d in media/*/; do
            [ -f "$d/release.txt" ] || continue
            TAG=$(sed -n 1p "$d/release.txt"); TITLE=$(sed -n 2p "$d/release.txt"); NOTES=$(sed -n '3,$p' "$d/release.txt")
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target ${{ github.sha }} --title "$TITLE" --notes "$NOTES"
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" $(ls "$d"* | grep -v release.txt) --clobber
          done
