name: fetch-media
# Временный помощник для сборки ролика br10: выполняет media/job.py (скачивание
# озвучки, аватара, поиск и загрузка футажа) и кладёт результат во временный
# пре-релиз media-br10. Удалить после сборки.
on:
  push:
    branches: [claude/project-thread-1l7e7h]
    paths: [media/job.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: run job
        run: |
          mkdir -p out
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python3 media/job.py out
          ls -la out
      - name: upload to temp prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=media-br10
          gh release view $TAG >/dev/null 2>&1 || gh release create $TAG --prerelease --title "br10 media (temp)" --notes "temp assets" --target ${{ github.sha }}
          gh release upload $TAG out/* --clobber
